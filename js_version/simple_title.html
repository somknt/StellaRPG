<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルタイトル画面テスト</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #ffb347;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1280" height="720"></canvas>
    
    <script>
        console.log('=== シンプルタイトル画面テスト ===');
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 入力管理
        const input = {
            keys: {},
            keysPrev: {},
            mouseX: 0,
            mouseY: 0,
            mouseClicked: false,
            mouseButtonPrev: false,
            
            isKeyPressed(code) {
                return this.keys[code] && !this.keysPrev[code];
            },
            
            update() {
                this.keysPrev = { ...this.keys };
                this.mouseClicked = false;
            }
        };
        
        // イベントリスナー
        window.addEventListener('keydown', (e) => {
            console.log('キー押下:', e.code);
            input.keys[e.code] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            input.keys[e.code] = false;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            input.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            input.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('click', (e) => {
            console.log('キャンバスクリック！');
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            console.log(`クリック座標: (${x.toFixed(0)}, ${y.toFixed(0)})`);
            input.mouseClicked = true;
            
            // ボタン判定
            if (x >= 490 && x <= 790 && y >= 270 && y <= 330) {
                console.log('✅ フリーバトルボタンをクリック！');
                alert('フリーバトル選択成功！\nキャラクター選択画面に移動します。');
                goToCharacterSelect();
            }
        });
        
        // ゲーム状態
        let gameState = 'title'; // 'title' or 'character_select'
        let selectedIndex = 0;
        let hoverIndex = -1;
        
        const buttons = [
            { text: 'フリーバトル', x: 490, y: 270, w: 300, h: 60 },
            { text: 'せってい', x: 490, y: 350, w: 300, h: 60 },
            { text: 'クレジット', x: 490, y: 430, w: 300, h: 60 }
        ];
        
        function goToCharacterSelect() {
            console.log('キャラクター選択画面に遷移');
            gameState = 'character_select';
        }
        
        // 更新
        function update() {
            input.update();
            
            if (gameState === 'title') {
                // キーボード入力
                if (input.isKeyPressed('Enter') || input.isKeyPressed('Space')) {
                    console.log('✅ Enter/Space押下！ボタン:', selectedIndex);
                    if (selectedIndex === 0) {
                        goToCharacterSelect();
                    }
                }
                
                if (input.isKeyPressed('ArrowDown') || input.isKeyPressed('KeyS')) {
                    selectedIndex = (selectedIndex + 1) % buttons.length;
                    console.log('選択:', selectedIndex);
                }
                
                if (input.isKeyPressed('ArrowUp') || input.isKeyPressed('KeyW')) {
                    selectedIndex = (selectedIndex - 1 + buttons.length) % buttons.length;
                    console.log('選択:', selectedIndex);
                }
                
                // マウスホバー
                hoverIndex = -1;
                for (let i = 0; i < buttons.length; i++) {
                    const btn = buttons[i];
                    if (input.mouseX >= btn.x && input.mouseX <= btn.x + btn.w &&
                        input.mouseY >= btn.y && input.mouseY <= btn.y + btn.h) {
                        hoverIndex = i;
                        selectedIndex = i;
                        break;
                    }
                }
            }
        }
        
        // 描画
        function draw() {
            // 背景
            const gradient = ctx.createLinearGradient(0, 0, 0, 720);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(1, '#4a4a7a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1280, 720);
            
            if (gameState === 'title') {
                // タイトル
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 80px serif';
                ctx.textAlign = 'center';
                ctx.fillText('星の子', 640, 150);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px sans-serif';
                ctx.fillText('Hoshi no Ko', 640, 200);
                
                // ボタン
                buttons.forEach((btn, i) => {
                    const isSelected = i === selectedIndex;
                    
                    // 背景
                    ctx.fillStyle = isSelected ? 'rgba(255, 215, 0, 0.3)' : 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                    
                    // 枠
                    ctx.strokeStyle = isSelected ? '#ffd700' : '#666';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
                    
                    // テキスト
                    ctx.fillStyle = isSelected ? '#ffd700' : '#ffffff';
                    ctx.font = isSelected ? 'bold 28px sans-serif' : '24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(btn.text, btn.x + btn.w/2, btn.y + btn.h/2 + 10);
                });
                
                // 操作説明
                ctx.fillStyle = '#aaa';
                ctx.font = '16px sans-serif';
                ctx.fillText('↑↓: 選択  Enter/Space: 決定  クリック: 選択', 640, 680);
                
            } else if (gameState === 'character_select') {
                // キャラクター選択画面
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('キャラクター選択画面', 640, 360);
                
                ctx.font = '24px Arial';
                ctx.fillText('成功！この画面が表示されれば正常です。', 640, 420);
            }
        }
        
        // メインループ
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        console.log('テスト開始');
        gameLoop();
    </script>
</body>
</html>
